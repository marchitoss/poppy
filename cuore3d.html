<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>❤️</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050002;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* =========================
           SCRITTA
           ========================= */

        #loveText {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            color: #fff;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(32px, 8vw, 70px);
            font-weight: bold;
            font-style: italic;

            letter-spacing: 2px;
            white-space: nowrap;

            text-shadow:
                0 0 5px #fff,
                0 0 15px #ff1e3c,
                0 0 30px #ff1e3c,
                0 0 60px #ff1e3c;

            opacity: 0;

            animation:
                appear 3s ease forwards,
                glow 2.5s ease-in-out infinite alternate;

            animation-delay: 2s, 5s;

            pointer-events: none;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 5px #fff,
                    0 0 15px #ff1e3c,
                    0 0 30px #ff1e3c;
            }

            to {
                text-shadow:
                    0 0 10px #fff,
                    0 0 25px #ff1e3c,
                    0 0 50px #ff1e3c,
                    0 0 80px #ff1e3c;
            }
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="loveText">
    Ti amo Poppy ❤️
</div>

<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // =========================
    // IMPOSTAZIONI
    // =========================

    const N = 2000;

    // Rotazione molto lenta
    const step = 0.006;

    let theta = 0;

    let width;
    let height;
    let SCALE;

    let pts = [];


    // =========================
    // DIMENSIONI
    // =========================

    function resize() {

        const dpr = window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        SCALE = Math.min(width, height) / 3.8;
    }

    window.addEventListener("resize", resize);

    resize();


    // =========================
    // CUORE
    // =========================

    function heart(u) {

        const x =
            1.6 * Math.pow(Math.sin(u), 3);

        const y =
            1.3 * Math.cos(u)
            - 0.5 * Math.cos(2 * u)
            - 0.2 * Math.cos(3 * u)
            - 0.1 * Math.cos(4 * u);

        return { x, y };
    }


    // =========================
    // RANDOM
    // =========================

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }


    // =========================
    // GENERAZIONE PUNTI
    // =========================

    for (let i = 0; i < N; i++) {

        const u = random(0, Math.PI * 2);

        const h = heart(u);

        const rad = Math.sqrt(Math.random());

        const x = h.x * rad;
        const y = h.y * rad;

        const z =
            1.1 *
            (1 - rad) *
            random(-1, 1);

        pts.push({
            x: x,
            y: y,
            z: z
        });
    }


    // =========================
    // COLORE
    // =========================

    function getColor(f) {

        f = Math.max(0, Math.min(1, f));

        const r1 = 70;
        const g1 = 0;
        const b1 = 10;

        const r2 = 255;
        const g2 = 30;
        const b2 = 50;

        const r =
            Math.floor(r1 + (r2 - r1) * f);

        const g =
            Math.floor(g1 + (g2 - g1) * f);

        const b =
            Math.floor(b1 + (b2 - b1) * f);

        return `rgb(${r}, ${g}, ${b})`;
    }


    // =========================
    // ANIMAZIONE
    // =========================

    function loop() {

        ctx.clearRect(0, 0, width, height);

        const centerX = width / 2;
        const centerY = height / 2;

        const ct = Math.cos(theta);
        const st = Math.sin(theta);

        const projected = [];


        // =========================
        // ROTAZIONE 3D
        // =========================

        for (const point of pts) {

            const xr =
                point.x * ct +
                point.z * st;

            const zr =
                -point.x * st +
                point.z * ct;

            projected.push({
                x: xr,
                y: point.y,
                z: zr
            });
        }


        // =========================
        // PROFONDITÀ
        // =========================

        projected.sort((a, b) => a.z - b.z);


        // =========================
        // DISEGNO
        // =========================

        for (const point of projected) {

            const depth =
                (point.z + 1.1) / 2.2;

            const x =
                centerX +
                point.x * SCALE;

            const y =
                centerY -
                point.y * SCALE;

            const size =
                2 + depth * 2.5;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                size / 2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = getColor(depth);

            ctx.fill();
        }


        // =========================
        // ROTAZIONE
        // =========================

        theta += step;

        requestAnimationFrame(loop);
    }


    // =========================
    // AVVIO
    // =========================

    loop();

</script>

</body>
</html>
